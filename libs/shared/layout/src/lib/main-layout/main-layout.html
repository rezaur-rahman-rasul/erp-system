<div class="flex h-screen w-full bg-slate-50 font-sans text-slate-800 overflow-hidden">
  
  <!-- Sidebar -->
  <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col h-full shrink-0 shadow-xl z-10 transition-all">
    <!-- Header -->
    <div class="h-16 flex items-center px-4 border-b border-slate-800 shrink-0">
      <button class="p-2 rounded-md hover:bg-slate-800 text-slate-400">
        <lucide-icon [img]="Menu" class="w-5 h-5"></lucide-icon>
      </button>
      <div class="ml-3 flex flex-col">
        <span class="text-white font-semibold text-sm leading-tight">Tailor Shop</span>
        <span class="text-xs text-slate-500 leading-tight">Management System</span>
      </div>
    </div>

    <!-- Search / Navigation Filter -->
    <div class="p-4 shrink-0 border-b border-slate-800/50 relative">
      <lucide-icon name="search" class="w-4 h-4 absolute left-7 top-6.5 text-slate-500"></lucide-icon>
      <input type="text" placeholder="Navigation" class="w-full bg-slate-950 border border-slate-800 rounded-md py-2 pl-9 pr-3 text-sm text-slate-300 placeholder-slate-600 focus:outline-none focus:border-slate-700" />
    </div>

    <!-- Nav Menu -->
    <div class="flex-1 overflow-y-auto py-4 px-3 flex flex-col gap-6 no-scrollbar">
      
      <!-- Main Section -->
      <div>
        <div class="text-[10px] font-bold tracking-widest text-slate-600 mb-2 px-3 uppercase">Main</div>
        <nav class="flex flex-col gap-1">
          <a routerLink="/iam/dashboard" routerLinkActive="bg-slate-800 text-white shadow-sm" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800/50 hover:text-slate-200 transition-colors cursor-pointer group">
            <lucide-icon [img]="LayoutDashboard" class="w-5 h-5 text-slate-400 group-hover:text-slate-300"></lucide-icon>
            <span class="text-sm font-medium">Dashboard</span>
          </a>
        </nav>
      </div>

      <!-- Identity & Access Section (Based on requirements) -->
      <div>
        <div class="text-[10px] font-bold tracking-widest text-slate-600 mb-2 px-3 uppercase">Identity & Access</div>
        <nav class="flex flex-col gap-1">
          <a routerLink="/iam/users" routerLinkActive="bg-slate-800 text-white shadow-sm" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800/50 hover:text-slate-200 transition-colors cursor-pointer group">
            <lucide-icon [img]="Users" class="w-5 h-5 text-slate-400 group-hover:text-slate-300"></lucide-icon>
            <span class="text-sm font-medium">Users</span>
          </a>
          <a routerLink="/iam/roles" routerLinkActive="bg-slate-800 text-white shadow-sm" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800/50 hover:text-slate-200 transition-colors cursor-pointer group">
            <lucide-icon [img]="UserSquare2" class="w-5 h-5 text-slate-400 group-hover:text-slate-300"></lucide-icon>
            <span class="text-sm font-medium">Roles</span>
          </a>
        </nav>
      </div>

      <!-- Management Section (From screenshot for visual match, though not our core feature) -->
      <div>
        <div class="text-[10px] font-bold tracking-widest text-slate-600 mb-2 px-3 uppercase">Management</div>
        <nav class="flex flex-col gap-1">
          <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800/50 hover:text-slate-200 transition-colors cursor-pointer group">
            <lucide-icon [img]="UserSquare2" class="w-5 h-5 text-slate-400 group-hover:text-slate-300"></lucide-icon>
            <span class="text-sm font-medium">Customers</span>
          </a>
          <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800/50 hover:text-slate-200 transition-colors cursor-pointer group">
            <lucide-icon [img]="Users" class="w-5 h-5 text-slate-400 group-hover:text-slate-300"></lucide-icon>
            <span class="text-sm font-medium">Employees</span>
          </a>
          <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800/50 hover:text-slate-200 transition-colors cursor-pointer group">
            <lucide-icon [img]="Ruler" class="w-5 h-5 text-slate-400 group-hover:text-slate-300"></lucide-icon>
            <span class="text-sm font-medium">Measurements</span>
          </a>
          <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800/50 hover:text-slate-200 transition-colors cursor-pointer group">
            <lucide-icon [img]="ShoppingBag" class="w-5 h-5 text-slate-400 group-hover:text-slate-300"></lucide-icon>
            <span class="text-sm font-medium">Orders</span>
          </a>
          <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800/50 hover:text-slate-200 transition-colors cursor-pointer group">
            <lucide-icon [img]="CreditCard" class="w-5 h-5 text-slate-400 group-hover:text-slate-300"></lucide-icon>
            <span class="text-sm font-medium">Payments</span>
          </a>
        </nav>
      </div>

    </div>

    <!-- User & Logout Footer -->
    <div class="mt-auto shrink-0 p-4 border-t border-slate-800 bg-slate-900/50">
      <div class="px-3 mb-3">
        <div class="text-sm font-medium text-slate-200">System Admin</div>
        <div class="text-xs text-slate-500">Identity Panel</div>
      </div>
      <button class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg bg-slate-800/60 hover:bg-red-500/10 hover:text-red-400 text-slate-400 transition-all cursor-pointer group">
        <lucide-icon [img]="LogOut" class="w-5 h-5"></lucide-icon>
        <span class="text-sm font-medium">Logout</span>
      </button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 flex flex-col h-full overflow-hidden bg-slate-50 relative">
    <div class="absolute inset-0 bg-gradient-to-br from-slate-100/50 to-transparent pointer-events-none"></div>
    <div class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 relative z-0">
      <!-- Feature views render here -->
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
