<section class="form-header-card surface-card">
  <div class="form-header-glow" aria-hidden="true"></div>

  <div class="form-header-content">
    <div class="form-header-icon">
      <app-lucide-icon [name]="icon" [size]="24" />
    </div>

    <div class="form-header-copy">
      @if (badge) {
        <div class="form-header-badge">{{ badge }}</div>
      }

      <h1 class="form-header-title">{{ title }}</h1>
      <p class="form-header-subtitle">{{ subtitle }}</p>
    </div>
  </div>

  @if (actionText && actionRoute) {
    <a [routerLink]="actionRoute" class="btn btn-secondary relative z-10">
      <app-lucide-icon name="arrowLeft" [size]="16" />
      <span>{{ actionText }}</span>
    </a>
  }
</section>
