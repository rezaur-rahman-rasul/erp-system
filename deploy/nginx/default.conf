log_format structured escape=json
  '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"x_forwarded_for":"$http_x_forwarded_for",'
    '"request_method":"$request_method",'
    '"request_uri":"$request_uri",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time",'
    '"http_referer":"$http_referer",'
    '"http_user_agent":"$http_user_agent"'
  '}';

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=${NGINX_RATE_LIMIT_RATE};
limit_req_status 429;
server_tokens off;
resolver 127.0.0.11 ipv6=off valid=30s;
resolver_timeout 5s;

access_log /dev/stdout structured;
error_log /dev/stderr warn;

server {
  listen 80;
  server_name ${NGINX_SERVER_NAME};

  client_max_body_size ${NGINX_CLIENT_MAX_BODY_SIZE};

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name ${NGINX_SERVER_NAME};

  root /usr/share/nginx/html;
  index index.html;
  set $gateway_upstream http://gateway:8080;

  ssl_certificate ${NGINX_SSL_CERTIFICATE};
  ssl_certificate_key ${NGINX_SSL_CERTIFICATE_KEY};
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "${NGINX_HSTS_VALUE}" always;

  client_max_body_size ${NGINX_CLIENT_MAX_BODY_SIZE};
  client_body_timeout 30s;
  keepalive_timeout 65s;
  send_timeout ${NGINX_SEND_TIMEOUT};

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    application/rss+xml
    application/vnd.ms-fontobject
    application/xml
    application/font-woff
    application/x-font-ttf
    image/svg+xml;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location = /nginx_status {
    access_log off;
    stub_status;
    allow ${NGINX_STATUS_ALLOW_CIDR};
    deny all;
  }

  location = /app-config.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri =404;
  }

  location ~ ^/(identity|organization|master-data)(/|$) {
    limit_req zone=api_rate_limit burst=${NGINX_RATE_LIMIT_BURST} nodelay;

    proxy_pass $gateway_upstream;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_connect_timeout ${NGINX_PROXY_CONNECT_TIMEOUT};
    proxy_send_timeout ${NGINX_PROXY_SEND_TIMEOUT};
    proxy_read_timeout ${NGINX_PROXY_READ_TIMEOUT};

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Prefix /$1;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location ^~ /identity-access/ {
    try_files $uri =404;
  }

  location ~* \.(?:css|gif|ico|jpeg|jpg|js|json|mjs|png|svg|webp|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
